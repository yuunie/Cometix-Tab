# Cometix Tab - Zed Extension
# AI Code Completion powered by Cursor API

id = "cometix-tab"
name = "Cometix Tab"
description = "AI Code Completion powered by Cursor API - Brings Cursor's intelligent code completion to Zed"
version = "0.1.0"
schema_version = 1
authors = ["Haleclipse <haleclipse@example.com>"]
repository = "https://github.com/Haleclipse/Cometix-Tab"

# MCP Server configuration for AI completion
[mcp_servers.cometix]
name = "Cometix AI Completion"
icon = "icons/icon.svg"

[mcp_servers.cometix.env]
LOG_LEVEL = "info"

# Platform-specific binaries
[mcp_servers.cometix.targets.darwin-aarch64]
archive = "https://github.com/Haleclipse/cometix-mcp-server/releases/download/v0.1.0/cometix-mcp-darwin-arm64.tar.gz"
cmd = "./cometix-mcp-server"
args = ["--stdio"]

[mcp_servers.cometix.targets.darwin-x86_64]
archive = "https://github.com/Haleclipse/cometix-mcp-server/releases/download/v0.1.0/cometix-mcp-darwin-x64.tar.gz"
cmd = "./cometix-mcp-server"
args = ["--stdio"]

[mcp_servers.cometix.targets.linux-x86_64]
archive = "https://github.com/Haleclipse/cometix-mcp-server/releases/download/v0.1.0/cometix-mcp-linux-x64.tar.gz"
cmd = "./cometix-mcp-server"
args = ["--stdio"]

[mcp_servers.cometix.targets.linux-aarch64]
archive = "https://github.com/Haleclipse/cometix-mcp-server/releases/download/v0.1.0/cometix-mcp-linux-arm64.tar.gz"
cmd = "./cometix-mcp-server"
args = ["--stdio"]

[mcp_servers.cometix.targets.windows-x86_64]
archive = "https://github.com/Haleclipse/cometix-mcp-server/releases/download/v0.1.0/cometix-mcp-windows-x64.zip"
cmd = "./cometix-mcp-server.exe"
args = ["--stdio"]
